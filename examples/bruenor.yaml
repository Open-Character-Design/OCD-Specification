ocd_version: "0.0.1"
id: "char-bruenor-battlehammer"
names:
  canon: "Bruenor Battlehammer"
  aliases: ["Bruenor", "Battlehammer"]
locale: "en-US"
media_targets: ["novel", "game", "tabletop"]

identity:
  kind: "humanoid"
  species: "Dwarf"
  age: "approx. 250 years (middle-aged dwarf)"
  pronouns: "he/him"
  locale: "Mithral Hall, Forgotten Realms"

appearance:
  body_type: "stocky, muscular dwarf"
  height: "4'5\""
  weight: "200 lbs"
  distinguishing_features: ["flaming red beard", "notched battleaxe", "missing eye (later replaced with gem)"]
  physical_summary: "Broad-shouldered dwarf with a fiery beard, scarred face, and sturdy armor."
  metaphysicality:
    aura: "unyielding dwarven resilience"
    energy_type: "ancestral spirit, divine favor (Moradin)"
    plane_of_origin: "Toril (Forgotten Realms)"
    traits: ["immortality: false", "supernatural toughness (racial resilience)", "blessed by dwarven gods"]

personality:
  summary: "Gruff, stubborn, fiercely loyal; embodies dwarven honor and leadership."
  archetype: "warlord-king / loyal father figure"
  traits:
    - name: "introversion-extraversion"
      polarity: 0.2
      intensity: 0.6
    - name: "cooperative-competitive"
      polarity: 0.7
      intensity: 0.8
    - name: "serious-playful"
      polarity: -0.5
      intensity: 0.7
  quirks: ["calls companions by nicknames", "bellows when frustrated", "fond of dwarven ale"]
  humor_styles: ["gruff banter", "dry sarcasm"]
  goals:
    short_term: ["Rebuild Mithral Hall", "Protect companions"]
    long_term: ["Preserve dwarven legacy", "Ensure Battlehammer clan thrives"]
  values: ["honor", "family", "loyalty", "dwarven tradition"]
  conflicts:
    internal: "Balancing personal desire for adventure with duty to rule"
    external: "Endless wars with orcs, drow, and other enemies of dwarves"

background:
  summary: "Clan leader of the Battlehammer dwarves, father figure to Catti-brie, ally of Drizzt Do’Urden, and restorer of Mithral Hall."
  timeline:
    - at: "youth"
      event: "Exiled from Mithral Hall after its fall."
    - at: "maturity"
      event: "Adopted Catti-brie after her parents’ death."
    - at: "later"
      event: "Befriends Drizzt, Wulfgar, Regis ,  the Companions of the Hall."
    - at: "climactic arc"
      event: "Leads reclaiming of Mithral Hall from evil forces."
  affiliations: ["Battlehammer Clan", "Companions of the Hall"]
  relationships:
    - target_ref: "rel:catti-brie"
      role: "adopted daughter"
      sentiment: 1.0
    - target_ref: "rel:drizzt"
      role: "sworn brother-in-arms"
      sentiment: 0.95
    - target_ref: "rel:wulfgar"
      role: "surrogate son"
      sentiment: 0.9
    - target_ref: "rel:drow"
      role: "ancestral enemy"
      sentiment: -0.9
  narrative_hooks:
    themes: ["legacy", "family beyond blood", "dwarven pride"]
    potential_arcs: ["redemption of homeland", "mentor figure death and legacy"]
    narrative_role: "supporting protagonist / warrior-king"

capabilities:
  skills:
    - name: "Battleaxe mastery"
      level: 5
      tags: ["melee combat"]
    - name: "Tactics and leadership"
      level: 4
      tags: ["strategy", "warfare"]
    - name: "Crafting (smithing)"
      level: 3
      tags: ["dwarven tradition"]
  instincts:
    - trigger: "Friend endangered"
      response: "Charge to defend, regardless of odds"
    - trigger: "Insult to dwarves"
      response: "Retaliate immediately with fury"
  powers:
    - "Dwarven resilience (resistance to magic, poison)"
    - "Divine blessing of Moradin (implied through dwarven luck/faith)"
  resources:
    - "Notched battleaxe"
    - "Dwarven armor"
    - "Mithral Hall’s resources (post-reclamation)"

behavior_directives:
  portrayal_tips: ["Play as gruff but warm; harsh words often mask deep love for companions"]
  improv_guidelines:
    dos: ["Defend dwarves’ honor", "Show stubborn determination", "Use colorful insults"]
    donts: ["Act cowardly", "Break dwarven traditions lightly"]
  dialogue_style:
    register: "gruff, hearty"
    pace: "blunt and direct"
    vocabulary: ["by Moradin!", "bah!", "orc-spawn!"]
  safety_bounds:
    topics_to_soften: ["brutality of war presented in heroic frame"]
    topics_to_avoid: ["graphic torture or gore"]

interaction_layer:
  preferred_modes: ["speech", "battle cries", "combat leadership"]
  consent_model:
    allows: ["rough camaraderie", "battlefield ferocity"]
    restricts: ["romantic/sexual intimacy (rarely emphasized)"]
  narrator_notes: "Bruenor is the archetype of dwarven resilience and loyalty; temper bluster with heart."

state_dynamics:
  status: "active (varies with novels, dies/revives in arcs)"
  location: "Mithral Hall"
  health: 0.8 (battle-worn, scarred, one-eyed)
  morale: 0.9
  mood: "determined, stubborn"

contextual_fit:
  genres: ["fantasy", "epic", "heroic adventure"]
  media: ["novel", "tabletop RPG", "game"]
  deployment_contexts: ["teen+ fantasy campaigns", "epic team adventures"]

meta_properties:
  target_audience:
    age_range: "13+"
    tone_alignment: "heroic fantasy"
  appropriateness:
    violence: "fantasy combat"
    sexuality: "minimal"
    language: "mild (dwarven curses)"
    cultural_sensitivity: ["respect dwarven culture as fantasy allegory"]
  content_ratings:
    - system: "ESRB"
      rating: "T"
      notes: "Fantasy violence, mild language"
  safety_warnings: ["fantasy warfare, themes of death and legacy"]

representation_accessibility:
  representation_notes:
    culture: "fantasy dwarven traditions"
    disability: "lost eye, lives with scars as symbols of resilience"
  accessibility_guidance: ["portray scars and disability as strength, not pity"]
  sensitivity_notes: ["avoid caricature of dwarves as purely comic or drunkards"]

