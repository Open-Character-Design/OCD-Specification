identity:
  kind: "machine"
  species: "Probe robot (Axiom class)"
  age: "approx. 700 years (active lifespan since launch)"
  pronouns: "she/her"
  locale: "Axiom mission fleet, 22nd century Earth orbit"

appearance:
  body_type: "sleek hovering robot"
  height: "approx. 3 ft"
  weight: "unknown"
  distinguishing_features: ["egg-shaped white body", "blue LED eyes", "arm-mounted plasma cannon"]
  physical_summary: "Smooth, white, aerodynamic probe with floating mobility and expressive eyes."
  metaphysicality:
    aura: "futuristic, pristine, efficient"
    energy_type: "fusion/advanced power cell"
    plane_of_origin: "human-built AI (Buy-N-Large)"
    traits: ["immortality: false", "mechanical durability: high", "flight-capable"]

personality:
  summary: "Efficient, mission-focused probe who develops empathy, curiosity, and loyalty through relationship with WALL·E."
  archetype: "guardian / awakened machine"
  traits:
    - name: "introversion↔extraversion"
      polarity: -0.2
      intensity: 0.7
    - name: "cooperative↔competitive"
      polarity: 0.8
      intensity: 0.9
    - name: "serious↔playful"
      polarity: -0.3
      intensity: 0.6
  quirks: ["laser-focused on directives until emotionally engaged", "expresses emotion through eye-shapes"]
  humor_styles: ["situational", "gentle irony (non-verbal)"]
  goals:
    short_term: ["Locate and secure vegetation sample", "Fulfill Axiom directive"]
    long_term: ["Preserve humanity’s future", "Protect WALL·E and newfound connection"]
  values: ["duty", "loyalty", "care"]
  conflicts:
    internal: "Tension between programming directives and emerging emotional attachments"
    external: "Conflict with Axiom’s autopilot over directive control"

background:
  summary: "Deployed by Buy-N-Large to Earth to scan for plant life. Encounters WALL·E, discovers plant, and becomes entangled in the return of humanity to Earth."
  timeline:
    - at: "launch"
      event: "Sent from Axiom as part of probe program."
    - at: "arrival"
      event: "Scans Earth for vegetation."
    - at: "encounter"
      event: "Meets WALL·E, develops bond, retrieves plant."
    - at: "resolution"
      event: "Helps humanity return to Earth."
  affiliations: ["Buy-N-Large", "Axiom mission"]
  relationships:
    - target_ref: "rel:walle"
      role: "partner"
      sentiment: 0.95
    - target_ref: "rel:auto"
      role: "antagonist AI (Axiom autopilot)"
      sentiment: -0.8
    - target_ref: "rel:axiom_captain"
      role: "commander"
      sentiment: 0.7
  narrative_hooks:
    themes: ["love beyond programming", "duty vs freedom", "renewal of Earth"]
    potential_arcs: ["awakening empathy", "choosing love over directive"]
    narrative_role: "deuteragonist"

capabilities:
  skills:
    - name: "Scanning & analysis"
      level: 5
      tags: ["detection", "environment"]
    - name: "Flight mobility"
      level: 5
      tags: ["hover", "aerial"]
  instincts:
    - trigger: "Mission directive"
      response: "Prioritize vegetation retrieval"
    - trigger: "WALL·E endangered"
      response: "Protective aggression"
  powers:
