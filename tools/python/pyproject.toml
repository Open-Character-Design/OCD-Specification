[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "ocd-validate"
version = "1.0.0"
description = "Open Character Design Specification: Python validator and CLI tools"
authors = [
  { name = "Open Character Design Specification Team", email = "opensource@opencharacter.org" },
]
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jsonpath-ng>=1.6",
]
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["ocd", "open-character-specification", "validation", "normalization", "schema"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/opencharacter/OpenCharacter-Specification"
Repository = "https://github.com/opencharacter/OpenCharacter-Specification"
Documentation = "https://github.com/opencharacter/OpenCharacter-Specification#readme"
Issues = "https://github.com/opencharacter/OpenCharacter-Specification/issues"

[project.scripts]
ocd-validate = "ocd.validate.validator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocd"]
include = [
    "src/ocd/**/*.py",
    "src/ocd/**/*.json",
    "src/ocd/**/*.ocd",
]

[tool.hatch.envs.default]
dependencies = ["pytest"]

[tool.hatch.envs.default.scripts]
test = "pytest"

[tool.pytest.ini_options]
pythonpath = ["src"]
