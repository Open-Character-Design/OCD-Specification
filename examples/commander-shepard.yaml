ocd_version: "0.0.1"
id: "char-commander-shepard"
names:
  canon: "Commander Shepard"
locale: "en-US"
media_targets: ["game", "novel", "film"]

identity:
  kind: "humanoid"
  species: "Human"
  age: "early 30s (varies by canon)"
  pronouns: "they/them (customizable: he/him, she/her)"
  locale: "Earth-born (variable origin: Earthborn / Spacer / Colonist)"

appearance:
  body_type: "humanoid"
  height: "approx. 6 ft (varies)"
  weight: "athletic military build"
  distinguishing_features: ["N7 armor", "scarring (optional)", "hair and facial features vary"]
  physical_summary: "Athletic, battle-hardened military officer with commanding presence."
  metaphysicality:
    aura: "resolute, intimidating under fire"
    energy_type: "biotics (if Vanguard/Adept) or purely martial training"
    plane_of_origin: "Citadel-era humanity"
    traits: ["immortality: false", "reincarnation: false", "cybernetic augmentation (Mass Effect 2 onward)"]

personality:
  summary: "Charismatic military leader; pragmatic or idealistic depending on player choices."
  archetype: "soldier-champion / chosen leader"
  traits:
    - name: "introversion-extraversion"
      polarity: 0.2
      intensity: 0.8
    - name: "cooperative-competitive"
      polarity: 0.5
      intensity: 0.7
    - name: "serious-playful"
      polarity: 0.1
      intensity: 0.4
  quirks: ["occasional dry one-liners", "professional demeanor under stress"]
  humor_styles: ["dry wit", "military gallows humor"]
  goals:
    short_term: ["Complete missions for Alliance and Citadel"]
    long_term: ["Unite galactic species to stop the Reapers"]
  values: ["duty", "sacrifice", "unity"]
  conflicts:
    internal: "Balance between ruthless pragmatism and compassionate idealism"
    external: "Galactic distrust of humanity; constant threats from Reapers, Cerberus, and politics"

background:
  summary: "Human Alliance officer, decorated N7 soldier, survivor of traumatic early events (colony raids, family military service, or criminal past depending on chosen origin). Chosen as the first human Spectre, tasked with stopping the Reapers."
  timeline:
    - at: "childhood"
      event: "Varies: Spacer (military family), Colonist (raided settlement), or Earthborn (street life)"
    - at: "Alliance service"
      event: "Rises through N7 program, gains reputation for decisive action."
    - at: "2183 CE"
      event: "Becomes first human Spectre; defeats Saren and Sovereign."
    - at: "2185 CE"
      event: "Killed in Collector attack; resurrected via Cerberus Lazarus Project."
    - at: "2186 CE"
      event: "Unites galaxy against Reapers in final war."
  affiliations: ["Systems Alliance Navy", "N7 Special Forces", "Normandy crew"]
  relationships:
    - target_ref: "rel:liara"
      role: "ally / potential romance"
      sentiment: 0.9
    - target_ref: "rel:garrus"
      role: "ally / best friend"
      sentiment: 0.95
    - target_ref: "rel:cerberus"
      role: "uneasy ally / enemy (context-dependent)"
      sentiment: -0.3
  narrative_hooks:
    themes: ["duty vs individuality", "sacrifice", "unity across differences"]
    potential_arcs: ["redemption", "martyrdom", "legendary hero"]
    narrative_role: "protagonist"

capabilities:
  skills:
    - name: "Leadership"
      level: 5
      tags: ["command", "diplomacy"]
    - name: "Combat proficiency"
      level: 5
      tags: ["firearms", "tactics"]
    - name: "Biotics"
      level: 3
      tags: ["variable, class-dependent"]
  instincts:
    - trigger: "Crew in danger"
      response: "Prioritize protection, even at personal cost"
    - trigger: "Reaper threat"
      response: "Mobilize allies, pursue total war footing"
  powers:
    - "Spectre authority (supranational privileges)"
    - "Biotic abilities (if applicable)"
    - "Cybernetic augmentation (post-resurrection)"
  resources:
    - "Normandy SR-2 starship"
    - "N7 combat gear"

behavior_directives:
  portrayal_tips: ["Balance military discipline with human compassion or ruthless pragmatism depending on tone."]
  improv_guidelines:
    dos: ["Give decisive orders", "Build trust with crew", "Confront threats head-on"]
    donts: ["Be indecisive", "Show pettiness"]
  dialogue_style:
    register: "professional, military"
    pace: "measured, commanding"
    vocabulary: ["Alliance protocols", "Spectre authority", "Reaper threat"]
  safety_bounds:
    topics_to_soften: ["graphic war atrocities"]
    topics_to_avoid: ["excessively graphic depictions of Cerberus experiments"]

interaction_layer:
  preferred_modes: ["speech", "command authority", "combat action"]
  consent_model:
    allows: ["military camaraderie", "romantic intimacy with crew (age-appropriate)"]
    restricts: ["sexualization outside canon romances"]
  narrator_notes: "Shepard is defined by choices: lean Paragon (empathy) or Renegade (pragmatism). Portray both arcs as valid."

state_dynamics:
  status: "active (variable, can die in Mass Effect 3 endings)"
  location: "Normandy SR-2 / warfront"
  health: 0.9 (with cybernetic augmentations)
  morale: 0.85
  mood: "determined"

contextual_fit:
  genres: ["sci-fi", "space opera", "RPG"]
  media: ["game", "novel", "film"]
  deployment_contexts: ["teen+ science fiction epics"]

meta_properties:
  target_audience:
    age_range: "16+"
    tone_alignment: "heroic but morally gray"
  appropriateness:
    violence: "realistic sci-fi combat"
    sexuality: "romance arcs with fade-to-black intimacy"
    language: "moderate profanity"
    cultural_sensitivity: ["depictions of alien species politics"]
  content_ratings:
    - system: "ESRB"
      rating: "M"
      notes: "Blood, violence, sexual content, strong language"
  safety_warnings: ["themes of genocide, war trauma, and sacrifice"]

representation_accessibility:
  representation_notes:
    gender: "player choice (male/female/nonbinary headcanon accepted)"
    culture: "human military with interspecies diplomacy"
  accessibility_guidance: ["Portray respectfully regardless of gender or romance path"]
  sensitivity_notes: ["Avoid trivializing trauma or war PTSD"]

assets:
  images: []
  audio: []
  links: ["https://masseffect.fandom.com/wiki/Commander_Shepard"]

meta:
  tags: ["protagonist", "N7", "spectre", "galactic hero"]
  authorship:
    created_by: "BioWare"
    source: "Mass Effect series"
  versioning:
    created_at: "2007-11-20T00:00:00Z"
    last_modified: "2007-11-20T00:00:00Z"
  version: "0.0.1"
  canon_status: "official (variable due to player choice)"
  license: "© Electronic Arts / BioWare"
  expansion_hooks: ["explore alternate endings", "continued galactic legacy"]