[package]
name = "validator-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenCharacter validator core: schema + custom rule engine"

[lib]
name = "validator_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
schemars = "0.8"
jsonschema = "0.17"
once_cell = "1.19"

[features]
default = []

