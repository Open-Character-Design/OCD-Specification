<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750">
  <defs>
    <style>
      .title { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 20px; font-weight: 600; fill: #1a1a1a; }
      .body { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 16px; fill: #1a1a1a; }
      .small { font-size: 14px; }
      .box { rx: 12; ry: 12; stroke-width: 2; }
      .edge { stroke: #6c8ebf; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#6c8ebf" />
    </marker>
  </defs>
  <rect x="420" y="200" width="220" height="90" class="box" fill="#dae8fc" stroke="#6c8ebf" />
  <text x="530" y="240" class="title" text-anchor="middle">CharacterDefinition</text>
  <text x="530" y="262" class="body" text-anchor="middle">root of every sheet</text>

  <rect x="420" y="50" width="220" height="80" class="box" fill="#d5e8d4" stroke="#82b366" />
  <text x="530" y="90" class="title" text-anchor="middle">Core Identifiers</text>
  <text x="530" y="112" class="body" text-anchor="middle">kind · ocs_version · id · slug</text>

  <rect x="130" y="150" width="200" height="80" class="box" fill="#ffe6cc" stroke="#d79b00" />
  <text x="230" y="190" class="title" text-anchor="middle">Names</text>
  <text x="230" y="212" class="body" text-anchor="middle">canon · display · aliases</text>

  <rect x="770" y="150" width="220" height="80" class="box" fill="#ffe6cc" stroke="#d79b00" />
  <text x="880" y="190" class="title" text-anchor="middle">Identity</text>
  <text x="880" y="212" class="body" text-anchor="middle">species · pronouns · embodiment</text>

  <rect x="770" y="50" width="220" height="80" class="box" fill="#f8cecc" stroke="#b85450" />
  <text x="880" y="90" class="title" text-anchor="middle">Meta &amp; Versioning</text>
  <text x="880" y="112" class="body" text-anchor="middle">tags · ratings · timestamps</text>

  <rect x="120" y="310" width="200" height="80" class="box" fill="#fff2cc" stroke="#d6b656" />
  <text x="220" y="348" class="title" text-anchor="middle">Personality</text>
  <text x="220" y="370" class="body" text-anchor="middle">trait axes · instincts</text>

  <rect x="360" y="340" width="220" height="80" class="box" fill="#fff2cc" stroke="#d6b656" />
  <text x="470" y="378" class="title" text-anchor="middle">Background</text>
  <text x="470" y="400" class="body" text-anchor="middle">timeline · relationships · affiliations</text>

  <rect x="640" y="340" width="220" height="80" class="box" fill="#fff2cc" stroke="#d6b656" />
  <text x="750" y="378" class="title" text-anchor="middle">Behavior</text>
  <text x="750" y="400" class="body" text-anchor="middle">portrayal tips · dialogue style · safety</text>

  <rect x="900" y="310" width="220" height="80" class="box" fill="#fff2cc" stroke="#d6b656" />
  <text x="1010" y="348" class="title" text-anchor="middle">State Dynamics</text>
  <text x="1010" y="370" class="body" text-anchor="middle">mood · health · resources</text>

  <rect x="180" y="470" width="220" height="80" class="box" fill="#e1d5e7" stroke="#9673a6" />
  <text x="290" y="508" class="title" text-anchor="middle">Media Profiles</text>
  <text x="290" y="530" class="body" text-anchor="middle">avatars · voice packs · handles</text>

  <rect x="420" y="470" width="220" height="80" class="box" fill="#e1d5e7" stroke="#9673a6" />
  <text x="530" y="508" class="title" text-anchor="middle">Extensions (x-*)</text>
  <text x="530" y="530" class="body" text-anchor="middle">project-specific mechanics</text>

  <rect x="660" y="470" width="220" height="80" class="box" fill="#e1d5e7" stroke="#9673a6" />
  <text x="770" y="508" class="title" text-anchor="middle">Appearance &amp; Metaphysics</text>
  <text x="770" y="530" class="body" text-anchor="middle">visual traits · supernatural context</text>

  <path d="M530 130 L530 200" class="edge"/>
  <path d="M330 190 L420 245" class="edge"/>
  <path d="M770 190 L640 245" class="edge"/>
  <path d="M880 130 L640 220" class="edge"/>
  <path d="M220 350 L420 245" class="edge"/>
  <path d="M470 340 L470 290" class="edge"/>
  <path d="M750 340 L750 290" class="edge"/>
  <path d="M1010 340 L860 245" class="edge"/>
  <path d="M290 470 L440 260" class="edge"/>
  <path d="M530 470 L530 290" class="edge"/>
  <path d="M770 470 L620 260" class="edge"/>
</svg>
