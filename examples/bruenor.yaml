x-dnd5e:
  edition: "5e"
  alignment: "Lawful Good"
  race: "Shield Dwarf (Mountain Dwarf)"
  class: "Fighter (Battle Master)"
  level: 12
  background: "Noble (Clan Leader) ,  secondary: Guild Artisan (Smith)"
  proficiency_bonus: +4

  ability_scores:
    STR: 18  # +4
    DEX: 12  # +1
    CON: 18  # +4
    INT: 10  # +0
    WIS: 12  # +1
    CHA: 14  # +2

  saving_throws:
    proficient: ["STR", "CON"]
    bonuses: {}

  combat_block:
    armor_class: 20                 # plate (18) + shield (+2) + Fighting Style: Defense (+1) → 21 if you allow Defense; otherwise 20
    initiative: "+1"
    speed: "25 ft"
    hit_dice: "12d10"
    hit_points: 120                 # ballpark: avg d10 (6) * 12 + CON mod (4)*12
    senses: ["darkvision 60 ft", "passive Perception 13"]
    resistances: ["poison (advantage on saves; resistance to poison damage)"]
    conditions_immunities: []
    damage_immunities: []

  languages: ["Common", "Dwarvish", "Undercommon"]
  skills:
    proficient: ["Athletics", "Intimidation", "History", "Perception", "Insight"]
    expertise: []
    notes: "History (stonework) benefits from Stonecunning (advantage; double proficiency at DM’s option per table ruling)."

  tools:
    proficient: ["smith's tools", "brewer's supplies", "vehicles (land)"]

  features_traits:
    racial:
      - "Dwarven Resilience (adv. vs poison; resistance to poison dmg)"
      - "Dwarven Combat Training (battleaxe, handaxe, light/warhammer)"
      - "Stonecunning (stonework lore; table variant: add double proficiency)"
    class:
      - "Fighting Style: Defense (+1 AC while wearing armor)"
      - "Second Wind (1d10+12, 1/short rest)"
      - "Action Surge (1/short rest)"
      - "Extra Attack (2)"
      - "Indomitable (2/long rest)"
      - "Battle Master Maneuvers (see below)"
    background:
      - "Position of Privilege (Noble) ,  audience with nobility, social sway"
    feats:
      - "Shield Master"
      - "Tough"

  battle_master:
    superiority_dice: "5 × d8 (short/long rest)"
    save_DC: 16                     # 8 + prof (+4) + STR mod (+4)
    maneuvers: ["Trip Attack", "Menacing Attack", "Precision Attack", "Riposte", "Parry"]

  attacks:
    - name: "Notched Battleaxe +1"
      attack_bonus: "+9"            # +4 STR +4 prof +1 magic
      damage: "1d8+5 slashing (1h) or 1d10+5 (versatile); magic weapon"
      properties: ["versatile", "magic +1"]
    - name: "Shield Bash"
      attack_bonus: "+8"            # STR + prof
      damage: "1d4+4 bludgeoning"
      properties: ["special: shove (contest)"]

  equipment:
    armor: ["Plate armor", "Shield (engraved, clan heraldry)"]
    weapons: ["Notched Battleaxe +1", "Handaxe (x2)"]
    kits: ["smith's tools", "brewer's supplies"]
    other: ["Clan signet", "Travel rations", "Mithral Hall tokens of office"]

  spellcasting:
    caster_type: "none"
    slots: {}
    known_spells: []

  resources_tracking:
    short_rest:
      second_wind: "1/short rest"
      action_surge: "1/short rest"
      superiority_dice: "regain all"
    long_rest:
      indomitable: "2/long rest"
      superiority_dice: "regain all"

  notes:
    rulings:
      - "Stonecunning wording varies by table/edition; set to advantage on related History checks; optionally add double proficiency."
      - "If Fighting Style: Defense is active, AC may be 21 (DM discretion per build)."
    provenance: "Values are sane defaults for a mid-tier Bruenor; tune to your campaign’s power curve."