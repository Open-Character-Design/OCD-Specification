    - at: "youth"
      event: "Falls in love with Kikyo, then betrayed and sealed."
    - at: "50 years later"
      event: "Released by Kagome, begins quest for Shikon Jewel shards."
  affiliations: ["Kagome’s group", "Allies: Shippo, Sango, Miroku, Kirara"]
  relationships:
    - target_ref: "rel:kagome"
      role: "companion / love interest"
      sentiment: 0.95
    - target_ref: "rel:kikyo"
      role: "former lover / tragic bond"
      sentiment: 0.8
    - target_ref: "rel:sesshomaru"
      role: "half-brother / rival"
      sentiment: -0.7
  narrative_hooks:
    themes: ["identity", "love", "redemption", "belonging"]
    potential_arcs: ["acceptance of hybrid nature", "resolution with Kagome"]
    narrative_role: "protagonist"

