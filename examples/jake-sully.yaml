identity:
  kind: "humanoid"
  species: "Human (Avatar: Na’vi hybrid body)"
  age: "mid-20s during Avatar (b. 2126)"
  pronouns: "he/him"
  locale: "Earth-born, relocates to Pandora"

appearance:
  body_type: "humanoid"
  height: "Na’vi avatar: ~10 ft, Human: ~6 ft"
  weight: "athletic (avatar), paraplegic (human body)"
  distinguishing_features: ["paraplegic human form", "blue-skinned Na’vi avatar", "braided neural queue"]
  physical_summary: "In human form, paraplegic ex-Marine; in Na’vi body, towering, athletic, blue-skinned with feline features."
  metaphysicality:
    aura: "spiritual bond with Eywa"
    energy_type: "biological + metaphysical link via neural transfer"
    plane_of_origin: "Earth-born, spiritually bound to Pandora"
    traits: ["immortality: false", "dual-body existence", "connection to Eywa"]

personality:
  summary: "Former soldier, pragmatic and resilient, transforms into empathetic leader."
  archetype: "outsider-turned-champion"
  traits:
    - name: "introversion↔extraversion"
      polarity: 0.2
      intensity: 0.7
    - name: "cooperative↔competitive"
      polarity: 0.5
      intensity: 0.9
    - name: "serious↔playful"
      polarity: 0.3
      intensity: 0.6
  quirks: ["occasional Marine slang in Na’vi context", "talks to himself while thinking"]
  humor_styles: ["sarcastic banter", "earnest camaraderie"]
  goals:
    short_term: ["Gain Na’vi trust", "Learn their ways", "Protect Neytiri and tribe"]
    long_term: ["Preserve Pandora from human exploitation", "Build life as Na’vi"]
  values: ["loyalty", "respect for nature", "family"]
  conflicts:
    internal: "Torn between human military roots and Na’vi spirituality"
    external: "Colonial exploitation of Pandora vs. defense of Na’vi"

background:
  summary: "Ex-Marine, paraplegic after war injury. Selected as Avatar operator on Pandora in place of his twin brother. Initially infiltrates the Na’vi for military intel but defects, embracing their cause."
  timeline:
    - at: "2126"
      event: "Born on Earth, twin to Tom Sully."
    - at: "pre-2154"
      event: "Marine, paralyzed in combat."
    - at: "2154"
      event: "Arrives on Pandora, enters Avatar program."
    - at: "later"
      event: "Bonds with Neytiri, becomes Toruk Makto, leads defense of Pandora."
  affiliations: ["Avatar Program", "Omaticaya Clan", "Na’vi"]
  relationships:
    - target_ref: "rel:neytiri"
      role: "mate"
      sentiment: 0.98
    - target_ref: "rel:colonel_quaritch"
      role: "antagonist / former commander"
      sentiment: -0.9
    - target_ref: "rel:eywa"
      role: "spiritual force"
      sentiment: 1.0
  narrative_hooks:
    themes: ["identity", "colonialism", "transformation", "love"]
    potential_arcs: ["outsider to leader", "bridge between worlds"]
    narrative_role: "protagonist"

capabilities:
  skills:
    - name: "Military tactics"
      level: 4
      tags: ["combat", "strategy"]
    - name: "Na’vi hunting & riding"
      level: 3
      tags: ["bonding", "survival"]
  instincts:
    - trigger: "Na’vi threatened"
      response: "Defends fiercely, prioritizes tribe"
    - trigger: "Military authority orders"
      response: "Conflicted, later defies orders"
  powers:
    - "Neural bond with Pandora creatures (tsaheylu)"
    - "Connection with Eywa during dire events"
  resources:
    - "Toruk (Great Leonopteryx mount)"
    - "Na’vi weapons (bow, spear)"

