site_name: Open Character Design Specification
site_description: A structured, portable format for defining characters across games, film/TV, books, and AI role-play
site_url: https://open-character-design.github.io/OCD-Specification/
repo_url: https://github.com/Open-Character-Design/OCD-Specification
repo_name: OpenCharacter-Specification
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Start Here:
    - Overview: start-here/index.md
    - Choose Your Path: start-here/paths.md
  - Journeys:
    - Creative Design: use-cases/creative.md
    - Interactive & Game Development: use-cases/interactive.md
    - Virtual & Real-Time Production: use-cases/virtual-production.md
    - Collaboration & Open Ecosystem: use-cases/community.md
  - Getting Started:
    - Create Your First Character: getting-started.md
    - Try In-Browser (Preview): validation/playground.md
    - Browse Examples: authoring/examples.md
    - Guided Tutorial: tutorial/index.md
  - Integration:
    - Overview: integration/examples.md
    - Validators (Python): integration/python-validator.md
    - Validators (JS/TS): integration/js-ts-validator.md
    - Agents & OCD: integration/agents.md
    - Extensions & Namespaces: integration/extensions-and-namespaces.md
    - Validator Roadmap: integration/validator-roadmap-todo.md
  - Reference:
    - Fields: reference/fields.md
    - Trait Model: spec/trait-model.md
    - Validation: reference/validation.md
    - Diagnostics: reference/diagnostics.md
    - Schema Overview: spec/schema-overview.md
  - Governance:
    - Contributing: governance/contributing-to-spec.md
    - Versioning & Roadmap: governance/versioning-and-roadmap.md
    - Changelog: changelog.md
  - Deep Dives:
    - Overview: deep-dives/index.md
    - Research Papers: 
      - Index: deep-dives/research/index.md
      - AI Agent Fields: deep-dives/research/ai-agent-fields-research.md
      - Common Character Fields: deep-dives/research/common-character-fields.md
      - Content Ratings: deep-dives/research/content-ratings-unified-schema.md
      - Licensing Metadata: deep-dives/research/licensing-metadata-schema.md
    - Case Studies:
      - Index: deep-dives/case-studies/index.md
      - Game Studio Integration: deep-dives/case-studies/game-studio-integration.md
    - White Papers:
      - Index: deep-dives/white-papers/index.md
      - Schema Implementation: deep-dives/white-papers/schema-core-fields-implementation.md
      - Trait Model Design: deep-dives/white-papers/trait-model-design.md
    - Methodology Guides:
      - Index: deep-dives/methodology/index.md
      - Character Analysis Framework: deep-dives/methodology/character-analysis-framework.md
    - Agents Directory: Agents.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  custom_dir: docs/overrides

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Open-Character-Design/OCD-Specification
  version:
    provider: mike
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
extra_javascript:
  - assets/jokes.js
  - assets/theme-auto-detect.js
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: Open-Character-Design
      repo: OpenCharacter-Specification
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
  - minify:
      minify_html: true

exclude_docs: |
  wiki/**
  README.md
