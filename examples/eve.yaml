representation_accessibility:
  representation_notes:
    type: "AI machine developing personhood"
  accessibility_guidance: ["express emotion with non-verbal cues", "avoid over-humanization"]
  sensitivity_notes: ["represent AI evolution as allegory, not caricature"]

